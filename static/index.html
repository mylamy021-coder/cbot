<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AI Hujaifa</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=DM+Sans:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:        #f5f0e8;
      --surface:   #ede8df;
      --surface2:  #e6dfd4;
      --border:    rgba(160,140,120,0.2);
      --accent:    #cc785c;
      --accent2:   #b5614a;
      --accent-dim:rgba(204,120,92,0.12);
      --text:      #2d2519;
      --text-muted:#8a7d6e;
      --bot-bubble:#eee8de;
      --header-bg: rgba(245,240,232,0.96);
    }
    *{margin:0;padding:0;box-sizing:border-box;}

    body{
      background:var(--bg);
      font-family:'Inter',sans-serif;
      color:var(--text);
      height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      overflow:hidden;
    }

    /* Ambient glows */
    body::before{
      content:'';position:fixed;
      top:-20%;left:-15%;
      width:700px;height:700px;
      background:radial-gradient(circle,rgba(204,120,92,0.08) 0%,transparent 65%);
      pointer-events:none;z-index:0;
    }
    body::after{
      content:'';position:fixed;
      bottom:-25%;right:-10%;
      width:550px;height:550px;
      background:radial-gradient(circle,rgba(180,155,120,0.12) 0%,transparent 70%);
      pointer-events:none;z-index:0;
    }

    .chat-container{
      width:100%;max-width:740px;height:100vh;
      display:flex;flex-direction:column;
      position:relative;z-index:1;
    }

    /* ── HEADER ── */
    .header{
      padding:16px 24px;
      display:flex;align-items:center;gap:14px;
      border-bottom:1px solid var(--border);
      background:var(--header-bg);
      backdrop-filter:blur(24px);
      -webkit-backdrop-filter:blur(24px);
    }

    .avatar-wrap{position:relative;flex-shrink:0;}

    .avatar{
      width:46px;height:46px;border-radius:16px;
      background:linear-gradient(145deg,#f5ede8,#e8d5c8);
      display:flex;align-items:center;justify-content:center;
      box-shadow:0 2px 16px rgba(204,120,92,0.22);
    }

    .status-dot{
      width:11px;height:11px;background:#5dbb6e;
      border-radius:50%;border:2.5px solid var(--bg);
      position:absolute;bottom:-1px;right:-1px;
      animation:pulseDot 2.4s infinite;
    }
    @keyframes pulseDot{
      0%,100%{box-shadow:0 0 0 0 rgba(93,187,110,0.5);}
      50%{box-shadow:0 0 0 5px rgba(93,187,110,0);}
    }

    .header-info h1{
      font-family:'DM Sans',sans-serif;
      font-size:17px;font-weight:700;
      letter-spacing:-0.1px;
      color:#2d2519;
    }
    .header-info p{font-size:12px;color:var(--text-muted);margin-top:2px;}

    .header-pill{
      margin-left:auto;
      background:var(--accent-dim);
      border:1px solid rgba(204,120,92,0.35);
      color:var(--accent2);
      font-size:11px;font-weight:500;
      padding:5px 12px;border-radius:20px;
      letter-spacing:0.2px;white-space:nowrap;
    }

    /* ── MESSAGES ── */
    .messages-area{
      flex:1;overflow-y:auto;
      padding:24px 20px;
      display:flex;flex-direction:column;gap:4px;
      scroll-behavior:smooth;
    }
    .messages-area::-webkit-scrollbar{width:3px;}
    .messages-area::-webkit-scrollbar-thumb{
      background:rgba(204,120,92,0.3);border-radius:4px;
    }

    .date-chip{
      align-self:center;font-size:11px;color:var(--text-muted);
      background:rgba(255,255,255,0.05);
      padding:4px 14px;border-radius:20px;
      margin:8px 0;border:1px solid var(--border);
    }

    .message-row{
      display:flex;align-items:flex-end;gap:9px;
      max-width:76%;
      animation:msgIn 0.28s cubic-bezier(0.34,1.5,0.64,1);
    }
    @keyframes msgIn{
      from{opacity:0;transform:translateY(12px) scale(0.96);}
      to{opacity:1;transform:translateY(0) scale(1);}
    }

    .message-row.user{align-self:flex-end;flex-direction:row-reverse;}
    .message-row.bot{align-self:flex-start;}

    .msg-av{
      width:32px;height:32px;border-radius:11px;
      background:linear-gradient(145deg,#f5ede8,#e8d5c8);
      display:flex;align-items:center;justify-content:center;
      flex-shrink:0;margin-bottom:2px;
      box-shadow:0 2px 8px rgba(0,0,0,0.2);
    }
    .msg-av.ghost{visibility:hidden;}

    .bubble{
      padding:11px 16px;border-radius:20px;
      font-size:14.5px;line-height:1.6;
      max-width:100%;word-break:break-word;
    }

    .message-row.user .bubble{
      background:var(--accent);color:#fff;
      border-bottom-right-radius:5px;
      box-shadow:0 4px 18px rgba(204,120,92,0.3);
    }
    .message-row.bot .bubble{
      background:var(--bot-bubble);color:var(--text);
      border-bottom-left-radius:5px;
      border:1px solid var(--border);
    }

    /* ── TYPING ── */
    .typing-row{
      display:flex;align-items:flex-end;gap:9px;
      align-self:flex-start;animation:msgIn 0.2s ease;
    }
    .typing-bubble{
      background:var(--bot-bubble);border:1px solid var(--border);
      border-radius:20px;border-bottom-left-radius:5px;
      padding:14px 18px;display:flex;gap:5px;align-items:center;
    }
    .typing-bubble span{
      width:6px;height:6px;background:var(--accent2);
      border-radius:50%;animation:typingBounce 1.3s infinite;opacity:0.6;
    }
    .typing-bubble span:nth-child(2){animation-delay:.2s;}
    .typing-bubble span:nth-child(3){animation-delay:.4s;}
    @keyframes typingBounce{
      0%,60%,100%{transform:translateY(0);opacity:0.5;}
      30%{transform:translateY(-6px);opacity:1;}
    }

    /* ── INPUT ── */
    .input-area{
      padding:14px 18px 20px;
      background:rgba(245,240,232,0.97);
      backdrop-filter:blur(24px);
      border-top:1px solid var(--border);
    }
    .input-box{
      display:flex;align-items:flex-end;gap:10px;
      background:rgba(255,255,255,0.7);
      border:1px solid var(--border);
      border-radius:22px;
      padding:10px 10px 10px 18px;
      transition:border-color .2s,box-shadow .2s;
    }
    .input-box:focus-within{
      border-color:rgba(204,120,92,0.5);
      box-shadow:0 0 0 3px rgba(204,120,92,0.1);
    }
    #messageInput{
      flex:1;background:transparent;border:none;outline:none;
      font-size:14.5px;font-family:'Inter',sans-serif;color:var(--text);
      resize:none;line-height:1.5;max-height:120px;overflow-y:auto;padding:2px 0;
    }
    #messageInput::placeholder{color:var(--text-muted);}
    #messageInput::-webkit-scrollbar{display:none;}

    .send-btn{
      width:40px;height:40px;border-radius:14px;border:none;
      background:linear-gradient(135deg,#cc785c,#e8956d);
      color:white;cursor:pointer;
      display:flex;align-items:center;justify-content:center;
      flex-shrink:0;
      transition:opacity .2s,transform .15s,box-shadow .2s;
      box-shadow:0 4px 14px rgba(204,120,92,0.4);
    }
    .send-btn:hover{opacity:.9;box-shadow:0 4px 22px rgba(204,120,92,0.55);}
    .send-btn:active{transform:scale(.91);}
    .send-btn:disabled{opacity:.3;cursor:default;box-shadow:none;}

    .hint{
      text-align:center;font-size:11px;
      color:var(--text-muted);margin-top:9px;opacity:.5;
    }

    /* ── RESPONSIVE ── */
    @media(max-width:600px){
      .chat-container{max-width:100%;}
      .message-row{max-width:90%;}
      .header{padding:12px 14px;}
      .messages-area{padding:16px 12px;}
      .input-area{padding:10px 12px 18px;}
      .header-pill{display:none;}
      .bubble{font-size:14px;}
      .hint{display:none;}
      .avatar{width:40px;height:40px;border-radius:13px;}
    }
  </style>
</head>
<body>
<div class="chat-container">

  <!-- Header -->
  <div class="header">
    <div class="avatar-wrap">
      <div class="avatar">
        <!-- Modern filled chat icon -->
        <svg width="24" height="24" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
          <!-- Main bubble -->
          <rect x="2" y="3" width="22" height="17" rx="5" fill="#cc785c"/>
          <!-- Tail -->
          <path d="M6 20 L4 26 L12 22" fill="#cc785c"/>
          <!-- Dots -->
          <circle cx="8" cy="11.5" r="2" fill="white" opacity="0.9"/>
          <circle cx="13" cy="11.5" r="2" fill="white" opacity="0.9"/>
          <circle cx="18" cy="11.5" r="2" fill="white" opacity="0.9"/>
          <!-- Second smaller bubble -->
          <rect x="14" y="14" width="16" height="12" rx="4" fill="#e8a88a" opacity="0.85"/>
          <circle cx="19" cy="20" r="1.4" fill="white" opacity="0.9"/>
          <circle cx="23" cy="20" r="1.4" fill="white" opacity="0.9"/>
          <circle cx="27" cy="20" r="1.4" fill="white" opacity="0.9"/>
        </svg>
      </div>
      <div class="status-dot"></div>
    </div>
    <div class="header-info">
      <h1>AI Hujaifa</h1>
      <p>Always here to chat</p>
    </div>
    <div class="header-pill">● Online</div>
  </div>

  <!-- Messages -->
  <div class="messages-area" id="messagesArea">
    <div class="date-chip">Today</div>
    <div class="message-row bot">
      <div class="msg-av">
        <svg width="18" height="18" viewBox="0 0 32 32" fill="none">
          <rect x="2" y="3" width="22" height="17" rx="5" fill="#cc785c"/>
          <path d="M6 20 L4 26 L12 22" fill="#cc785c"/>
          <circle cx="8" cy="11.5" r="2" fill="white" opacity="0.9"/>
          <circle cx="13" cy="11.5" r="2" fill="white" opacity="0.9"/>
          <circle cx="18" cy="11.5" r="2" fill="white" opacity="0.9"/>
          <rect x="14" y="14" width="16" height="12" rx="4" fill="#e8a88a" opacity="0.85"/>
          <circle cx="19" cy="20" r="1.4" fill="white" opacity="0.9"/>
          <circle cx="23" cy="20" r="1.4" fill="white" opacity="0.9"/>
          <circle cx="27" cy="20" r="1.4" fill="white" opacity="0.9"/>
        </svg>
      </div>
      <div class="bubble">Hey! What's up? I'm AI Hujaifa — let's talk about anything 👋</div>
    </div>
  </div>

  <!-- Input -->
  <div class="input-area">
    <div class="input-box">
      <textarea id="messageInput" rows="1" placeholder="Message AI Hujaifa..."></textarea>
      <button class="send-btn" id="sendBtn" onclick="sendMessage()">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
          <line x1="22" y1="2" x2="11" y2="13"/>
          <polygon points="22 2 15 22 11 13 2 9 22 2"/>
        </svg>
      </button>
    </div>
    <p class="hint">Enter to send · Shift+Enter for new line</p>
  </div>
</div>

<script>
  const ICON_SVG = `<svg width="18" height="18" viewBox="0 0 32 32" fill="none"><rect x="2" y="3" width="22" height="17" rx="5" fill="#cc785c"/><path d="M6 20 L4 26 L12 22" fill="#cc785c"/><circle cx="8" cy="11.5" r="2" fill="white" opacity="0.9"/><circle cx="13" cy="11.5" r="2" fill="white" opacity="0.9"/><circle cx="18" cy="11.5" r="2" fill="white" opacity="0.9"/><rect x="14" y="14" width="16" height="12" rx="4" fill="#e8a88a" opacity="0.85"/><circle cx="19" cy="20" r="1.4" fill="white" opacity="0.9"/><circle cx="23" cy="20" r="1.4" fill="white" opacity="0.9"/><circle cx="27" cy="20" r="1.4" fill="white" opacity="0.9"/></svg>`;

  const input   = document.getElementById('messageInput');
  const area    = document.getElementById('messagesArea');
  const sendBtn = document.getElementById('sendBtn');
  const SESSION_ID = 'sess_' + Math.random().toString(36).substr(2,9);

  input.addEventListener('input', () => {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 120) + 'px';
  });
  input.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
  });

  function addMessage(text, sender) {
    const row = document.createElement('div');
    row.className = `message-row ${sender}`;
    if (sender === 'bot') {
      const av = document.createElement('div');
      av.className = 'msg-av';
      av.innerHTML = ICON_SVG;
      const prev = area.lastElementChild;
      if (prev?.classList.contains('message-row') && prev.classList.contains('bot'))
        av.classList.add('ghost');
      row.appendChild(av);
    }
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.textContent = text;
    row.appendChild(bubble);
    area.appendChild(row);
    area.scrollTop = area.scrollHeight;
  }

  function showTyping() {
    const row = document.createElement('div');
    row.className = 'typing-row'; row.id = 'typing';
    row.innerHTML = `<div class="msg-av">${ICON_SVG}</div><div class="typing-bubble"><span></span><span></span><span></span></div>`;
    area.appendChild(row);
    area.scrollTop = area.scrollHeight;
  }
  function hideTyping() { document.getElementById('typing')?.remove(); }

  async function sendMessage() {
    const text = input.value.trim();
    if (!text) return;
    addMessage(text, 'user');
    input.value = ''; input.style.height = 'auto';
    sendBtn.disabled = true;
    showTyping();
    try {
      const res = await fetch('/chat', {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ message: text, session_id: SESSION_ID })
      });
      const data = await res.json();
      hideTyping();
      addMessage(data.reply, 'bot');
    } catch {
      hideTyping();
      addMessage('Something went wrong, try again!', 'bot');
    }
    sendBtn.disabled = false;
    input.focus();
  }
</script>
</body>
</html>
